<!DOCTYPE html>
<html lang="en" class="h-full bg-black select-none text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* SF Pro / System font stack for authentic iOS feel */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        /* Flash animation on shutter */
        @keyframes iosFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .shutter-flash-active {
            animation: iosFlash 0.25s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
        }

        /* Smooth camera flip rotation */
        .flip-transition {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom scrollbar hiding for gallery modal */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-black overflow-hidden">

    <!-- Top iOS Camera Bar -->
    <header class="h-14 px-6 flex items-center justify-between z-20 bg-black/80 backdrop-blur-md flex-shrink-0">
        <!-- Flash Control Button -->
        <button id="flashToggleBtn" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:text-white text-lg transition active:opacity-60">
            <i id="flashIcon" class="fa-solid fa-bolt-slash"></i>
        </button>

        <!-- Location Status Indicator Badge -->
        <div id="locationBadge" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-xl border border-white/10 text-xs font-medium text-white/90">
            <i id="locationBadgeIcon" class="fa-solid fa-location-arrow text-yellow-400 text-[11px] animate-pulse"></i>
            <span id="locationBadgeText" class="tracking-tight text-[11px] font-sans">Acquiring location...</span>
        </div>

        <!-- Camera Switch (Front/Back) -->
        <button id="flipCamTopBtn" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:text-white text-lg transition active:opacity-60">
            <i class="fa-solid fa-camera-rotate"></i>
        </button>
    </header>

    <!-- Main Viewfinder Area -->
    <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
        <!-- Live Video Element -->
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover flip-transition"></video>

        <!-- Camera Initialization Spinner -->
        <div id="camLoader" class="absolute inset-0 bg-black flex flex-col items-center justify-center gap-3 z-10">
            <div class="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
        </div>

        <!-- Camera Access Fallback UI -->
        <div id="camFallback" class="hidden absolute inset-0 bg-zinc-950 flex flex-col items-center justify-center p-6 text-center z-10">
            <i class="fa-solid fa-camera text-4xl text-zinc-600 mb-3"></i>
            <p class="text-sm font-medium text-zinc-300 mb-4">Camera Access Required</p>
            <label class="px-5 py-2.5 rounded-full bg-white text-black font-semibold text-xs cursor-pointer active:scale-95 transition">
                Upload Photo Instead
                <input type="file" id="fallbackFileInput" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Shutter White Flash Overlay -->
        <div id="shutterFlashOverlay" class="hidden absolute inset-0 bg-white z-30 pointer-events-none"></div>
    </main>

    <!-- Bottom Controls Deck (iPhone Camera Style) -->
    <footer class="h-36 px-8 flex items-center justify-between z-20 bg-black flex-shrink-0">
        <!-- Thumbnail / Gallery Trigger (Left) -->
        <button id="galleryThumbBtn" class="w-12 h-12 rounded-full border-2 border-white/30 overflow-hidden bg-zinc-900 flex items-center justify-center relative active:scale-90 transition transform">
            <i id="thumbPlaceholderIcon" class="fa-solid fa-image text-white/50 text-base"></i>
            <img id="thumbImage" class="hidden w-full h-full object-cover">
        </button>

        <!-- Classic iOS White Shutter Button (Center) -->
        <button id="shutterBtn" class="w-20 h-20 rounded-full border-[4px] border-white p-1 flex items-center justify-center focus:outline-none active:scale-95 transition-transform duration-100">
            <div class="w-full h-full bg-white rounded-full active:bg-zinc-300 transition-colors"></div>
        </button>

        <!-- Quick Flip / Direct Upload Switch (Right) -->
        <label class="w-12 h-12 rounded-full bg-zinc-900 border border-white/10 flex items-center justify-center text-white/80 active:scale-90 transition cursor-pointer">
            <i class="fa-solid fa-arrow-up-from-bracket text-sm"></i>
            <input type="file" id="directFileInput" accept="image/*" class="hidden">
        </label>
    </footer>

    <!-- Photo Gallery & Fullscreen Preview Modal -->
    <div id="galleryModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <!-- Modal Top Bar -->
        <div class="h-14 px-4 flex items-center justify-between border-b border-zinc-900 bg-black">
            <button id="closeGalleryBtn" class="text-yellow-400 font-semibold text-base px-2 py-1 active:opacity-60">
                Done
            </button>
            <span id="galleryCounter" class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">1 of 1</span>
            <button id="deletePhotoBtn" class="text-red-500 text-lg p-2 active:opacity-60">
                <i class="fa-regular fa-trash-can"></i>
            </button>
        </div>

        <!-- Image Viewer Container -->
        <div class="flex-1 relative bg-black flex items-center justify-center overflow-hidden p-2">
            <img id="previewImage" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl">
        </div>

        <!-- Modal Bottom Actions Bar -->
        <div class="h-20 px-8 flex items-center justify-between border-t border-zinc-900 bg-black flex-shrink-0">
            <button id="shareDownloadBtn" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-xs border border-white/10 active:scale-95 transition">
                <i class="fa-solid fa-download"></i>
                <span>Save to Device</span>
            </button>
            <button id="copyCoordsBtn" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-xs border border-white/10 active:scale-95 transition">
                <i class="fa-regular fa-copy"></i>
                <span>Copy Details</span>
            </button>
        </div>
    </div>

    <!-- Canvas Element for Burning Metadata Watermarks onto Captured Images -->
    <canvas id="photoCanvas" class="hidden"></canvas>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-zinc-900/90 border border-zinc-800 text-white px-4 py-2 rounded-full text-xs font-medium z-50 opacity-0 pointer-events-none transition-all duration-300 shadow-2xl flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-check text-yellow-400"></i>
        <span id="toastMsg">Notification</span>
    </div>

    <script>
        // Camera & App State
        const state = {
            stream: null,
            facingMode: 'environment', // Start with rear main camera
            flashEnabled: false,
            photos: [],
            currentPhotoIndex: 0,
            location: {
                lat: null,
                lng: null,
                placeName: 'Acquiring location...',
                loaded: false
            }
        };

        // DOM Element Cache
        const webcam = document.getElementById('webcam');
        const camLoader = document.getElementById('camLoader');
        const camFallback = document.getElementById('camFallback');
        const shutterBtn = document.getElementById('shutterBtn');
        const flipCamTopBtn = document.getElementById('flipCamTopBtn');
        const flashToggleBtn = document.getElementById('flashToggleBtn');
        const flashIcon = document.getElementById('flashIcon');
        const locationBadgeIcon = document.getElementById('locationBadgeIcon');
        const locationBadgeText = document.getElementById('locationBadgeText');
        const shutterFlashOverlay = document.getElementById('shutterFlashOverlay');

        // Gallery DOM Cache
        const galleryThumbBtn = document.getElementById('galleryThumbBtn');
        const thumbImage = document.getElementById('thumbImage');
        const thumbPlaceholderIcon = document.getElementById('thumbPlaceholderIcon');
        const galleryModal = document.getElementById('galleryModal');
        const closeGalleryBtn = document.getElementById('closeGalleryBtn');
        const previewImage = document.getElementById('previewImage');
        const galleryCounter = document.getElementById('galleryCounter');
        const deletePhotoBtn = document.getElementById('deletePhotoBtn');
        const shareDownloadBtn = document.getElementById('shareDownloadBtn');
        const copyCoordsBtn = document.getElementById('copyCoordsBtn');

        // Audio Shutter Feedback (Synthesizer via Web Audio API)
        function playShutterSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}

            // Trigger device haptic vibration if supported
            if (navigator.vibrate) {
                navigator.vibrate(35);
            }
        }

        // Initialize iOS Camera Stream
        async function startCamera() {
            camLoader.classList.remove('hidden');
            camFallback.classList.add('hidden');

            if (state.stream) {
                state.stream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: state.facingMode },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                state.stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcam.srcObject = state.stream;

                // Handle front video mirroring
                if (state.facingMode === 'user') {
                    webcam.style.transform = 'scaleX(-1)';
                } else {
                    webcam.style.transform = 'scaleX(1)';
                }

                camLoader.classList.add('hidden');
            } catch (err) {
                console.warn("Camera streaming failed:", err);
                camLoader.classList.add('hidden');
                camFallback.classList.remove('hidden');
            }
        }

        // Camera Switch Event
        flipCamTopBtn.addEventListener('click', () => {
            state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        // Flash Toggle Switch
        flashToggleBtn.addEventListener('click', () => {
            state.flashEnabled = !state.flashEnabled;
            if (state.flashEnabled) {
                flashIcon.className = "fa-solid fa-bolt text-yellow-400";
                showToast("Flash On", "fa-bolt");
            } else {
                flashIcon.className = "fa-solid fa-bolt-slash text-white/90";
                showToast("Flash Off", "fa-bolt-slash");
            }
        });

        // Geolocation & Reverse Geocoding Engine
        function initLocationServices() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        state.location.lat = lat;
                        state.location.lng = lng;

                        // Perform reverse geocoding via OpenStreetMap API
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14`);
                            const data = await response.json();
                            
                            if (data && data.address) {
                                const city = data.address.city || data.address.town || data.address.village || data.address.county || "Location Recorded";
                                const country = data.address.country || "";
                                state.location.placeName = country ? `${city}, ${country}` : city;
                            } else {
                                state.location.placeName = `${lat.toFixed(3)}°, ${lng.toFixed(3)}°`;
                            }
                        } catch (e) {
                            state.location.placeName = `${lat.toFixed(3)}°, ${lng.toFixed(3)}°`;
                        }

                        state.location.loaded = true;
                        updateLocationBadgeUI();
                    },
                    (error) => {
                        console.warn("Location permission error:", error.message);
                        state.location.placeName = "Location Unavailable";
                        state.location.loaded = false;
                        updateLocationBadgeUI();
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                state.location.placeName = "GPS Not Supported";
                updateLocationBadgeUI();
            }
        }

        function updateLocationBadgeUI() {
            if (state.location.loaded) {
                locationBadgeIcon.className = "fa-solid fa-location-dot text-yellow-400 text-[11px]";
                locationBadgeText.textContent = state.location.placeName;
            } else {
                locationBadgeIcon.className = "fa-solid fa-location-arrow text-white/50 text-[11px]";
                locationBadgeText.textContent = state.location.placeName;
            }
        }

        // Photo Capture & Watermark Burning Process
        shutterBtn.addEventListener('click', capturePhoto);

        function capturePhoto() {
            // Screen flash effect
            shutterFlashOverlay.classList.remove('hidden');
            shutterFlashOverlay.classList.add('shutter-flash-active');
            playShutterSound();

            setTimeout(() => {
                shutterFlashOverlay.classList.add('hidden');
                shutterFlashOverlay.classList.remove('shutter-flash-active');
            }, 250);

            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');

            if (webcam.srcObject && webcam.videoWidth) {
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;

                // Handle camera mirroring for front lens
                if (state.facingMode === 'user') {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
                ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transformation

                // Burn-in Metadata Bar onto bottom of image
                burnMetadataBar(canvas, ctx);

                const finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
                savePhotoToGallery(finalDataUrl);
            }
        }

        // Burn Metadata Footer directly into Image Output
        function burnMetadataBar(canvas, ctx) {
            const now = new Date();
            const dateStr = now.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const latStr = state.location.lat ? state.location.lat.toFixed(5) : 'N/A';
            const lngStr = state.location.lng ? state.location.lng.toFixed(5) : 'N/A';
            const coordsStr = `GPS: ${latStr}°, ${lngStr}°`;
            const placeStr = state.location.placeName;

            // Bar dimensions proportional to image size
            const barHeight = Math.max(60, Math.round(canvas.height * 0.085));
            const fontBaseSize = Math.max(13, Math.round(barHeight * 0.26));
            const padding = Math.round(barHeight * 0.22);

            // Dark subtle translucent gradient bar at the bottom
            const gradient = ctx.createLinearGradient(0, canvas.height - barHeight - 20, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(0.3, 'rgba(0, 0, 0, 0.6)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.88)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, canvas.height - barHeight - 20, canvas.width, barHeight + 20);

            // Subtle vertical accent line (iOS yellow marker)
            ctx.fillStyle = '#facc15'; // Yellow-400
            ctx.fillRect(padding, canvas.height - barHeight + (padding / 2), 3, barHeight - padding);

            // Left Side: Location Name & Coordinates
            ctx.fillStyle = '#ffffff';
            ctx.font = `600 ${fontBaseSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillText(placeStr, padding + 12, canvas.height - barHeight + (padding / 2));

            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.font = `400 ${Math.round(fontBaseSize * 0.85)}px font-mono, SFMono-Regular, monospace`;
            ctx.fillText(coordsStr, padding + 12, canvas.height - barHeight + (padding / 2) + fontBaseSize + 4);

            // Right Side: Date & Time
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.font = `600 ${fontBaseSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.fillText(timeStr, canvas.width - padding, canvas.height - barHeight + (padding / 2));

            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.font = `400 ${Math.round(fontBaseSize * 0.85)}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.fillText(dateStr, canvas.width - padding, canvas.height - barHeight + (padding / 2) + fontBaseSize + 4);

            ctx.textAlign = 'left'; // Reset alignment
        }

        // Direct Local File Upload Handling
        function handleFileInput(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('photoCanvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        burnMetadataBar(canvas, ctx);
                        savePhotoToGallery(canvas.toDataURL('image/jpeg', 0.95));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
        document.getElementById('fallbackFileInput').addEventListener('change', handleFileInput);
        document.getElementById('directFileInput').addEventListener('change', handleFileInput);

        // Save Photo & Update Thumbnail Bubble
        function savePhotoToGallery(dataUrl) {
            const photoRecord = {
                id: Date.now(),
                url: dataUrl,
                location: { ...state.location },
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString()
            };

            state.photos.unshift(photoRecord);
            state.currentPhotoIndex = 0;

            // Update bottom-left gallery bubble
            thumbImage.src = dataUrl;
            thumbImage.classList.remove('hidden');
            thumbPlaceholderIcon.classList.add('hidden');

            showToast("Photo Saved", "fa-circle-check");
        }

        // Gallery Modal Toggle & Navigation
        galleryThumbBtn.addEventListener('click', () => {
            if (state.photos.length === 0) return;
            openGallery();
        });

        closeGalleryBtn.addEventListener('click', () => {
            galleryModal.classList.add('hidden');
        });

        function openGallery() {
            if (state.photos.length === 0) return;
            updateGalleryModal();
            galleryModal.classList.remove('hidden');
        }

        function updateGalleryModal() {
            const currentPhoto = state.photos[state.currentPhotoIndex];
            previewImage.src = currentPhoto.url;
            galleryCounter.textContent = `${state.currentPhotoIndex + 1} of ${state.photos.length}`;
        }

        // Delete Photo
        deletePhotoBtn.addEventListener('click', () => {
            if (state.photos.length === 0) return;

            state.photos.splice(state.currentPhotoIndex, 1);
            if (state.photos.length === 0) {
                galleryModal.classList.add('hidden');
                thumbImage.classList.add('hidden');
                thumbPlaceholderIcon.classList.remove('hidden');
                showToast("All photos deleted", "fa-trash-can");
            } else {
                if (state.currentPhotoIndex >= state.photos.length) {
                    state.currentPhotoIndex = state.photos.length - 1;
                }
                updateGalleryModal();
                thumbImage.src = state.photos[0].url;
                showToast("Photo deleted", "fa-trash-can");
            }
        });

        // Download Photo
        shareDownloadBtn.addEventListener('click', () => {
            if (state.photos.length === 0) return;
            const photo = state.photos[state.currentPhotoIndex];
            const a = document.createElement('a');
            a.href = photo.url;
            a.download = `IMG_${photo.id}.jpg`;
            a.click();
            showToast("Saved to Device Downloads", "fa-download");
        });

        // Copy Location Details
        copyCoordsBtn.addEventListener('click', () => {
            if (state.photos.length === 0) return;
            const photo = state.photos[state.currentPhotoIndex];
            const details = `${photo.location.placeName}\nLat: ${photo.location.lat}, Lng: ${photo.location.lng}\nDate: ${photo.date} ${photo.time}`;
            
            navigator.clipboard.writeText(details).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = details;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            });
            showToast("Details Copied to Clipboard", "fa-copy");
        });

        // Toast Helper
        function showToast(msg, icon = "fa-check") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${icon} text-yellow-400`;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // App Initialization
        window.onload = function() {
            startCamera();
            initLocationServices();
        };
    </script>
</body>
</html>
