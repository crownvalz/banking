<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .table-container {
            margin: 20px auto;
            text-align: center;
        }
        .header-row {
            background-color: #bde0fe;
            color: #000;
        }
        .out-row {
            color: red;
        }
        .in-row {
            color: blue;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="container">
        <h1 class="text-center">Local Currency Calculator</h1>
        <h3 class="text-center">Teller Balancing Assistant - TZS</h3>

        <div class="table-responsive table-container">
            <table class="table table-bordered table-hover">
                <thead class="header-row">
                    <tr>
                        <th>Date</th>
                        <th>Transaction Type</th>
                        <th>10,000.00</th>
                        <th>5,000.00</th>
                        <th>2,000.00</th>
                        <th>1,000.00</th>
                        <th>500.00</th>
                        <th>Coin</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="transactionTableBody">
                    <!-- Transaction rows will be dynamically inserted here -->
                </tbody>
                <tfoot>
                    <tr id="closingBalanceRow" class="in-row">
                        <!-- Closing Balance Row -->
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="text-center mb-3">
            <button class="btn btn-primary" data-toggle="modal" data-target="#transactionModal" onclick="setTransactionType('in')">IN</button>
            <button class="btn btn-danger" data-toggle="modal" data-target="#transactionModal" onclick="setTransactionType('out')">OUT</button>
            <button class="btn btn-secondary" data-toggle="modal" data-target="#transactionModal" onclick="setTransactionType('opening')">Opening Balance</button>
            <button class="btn btn-warning" onclick="endDay()">End Day</button>
        </div>

        <!-- Modal for transaction input -->
        <div class="modal fade" id="transactionModal" tabindex="-1" aria-labelledby="transactionModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="transactionModalLabel">Add Transaction</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="transactionForm">
                            <input type="hidden" id="transactionType" name="transactionType">
                            <div class="form-group">
                                <label for="input-10000">10,000.00:</label>
                                <input type="number" class="form-control" id="input-10000" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="input-5000">5,000.00:</label>
                                <input type="number" class="form-control" id="input-5000" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="input-2000">2,000.00:</label>
                                <input type="number" class="form-control" id="input-2000" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="input-1000">1,000.00:</label>
                                <input type="number" class="form-control" id="input-1000" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="input-500">500.00:</label>
                                <input type="number" class="form-control" id="input-500" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="input-coin">Coin:</label>
                                <input type="number" class="form-control" id="input-coin" min="0" value="0">
                            </div>
                            <button type="button" class="btn btn-primary" onclick="saveTransaction()">Save Transaction</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
      // Firebase Configuration
      const firebaseConfig = {
          apiKey: "AIzaSyBP0Me_Y4_hpglYqZOV6Ixlc59q3x05Ovg",
          authDomain: "godi-90a1d.firebaseapp.com",
          projectId: "godi-90a1d",
          storageBucket: "godi-90a1d.appspot.com",
          messagingSenderId: "875425421902",
          appId: "1:875425421902:web:38af09bddec63e0d74411f"
      };
  
      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
  
      const transactionTableBody = document.getElementById('transactionTableBody');
      const closingBalanceRow = document.getElementById('closingBalanceRow');
  
      let openingBalance = 0; // Set your initial opening balance here
  
      function setTransactionType(type) {
          document.getElementById('transactionType').value = type;
      }
  
      async function saveTransaction() {
          const transactionType = document.getElementById('transactionType').value;
          const denom_10000 = parseInt(document.getElementById('input-10000').value) || 0;
          const denom_5000 = parseInt(document.getElementById('input-5000').value) || 0;
          const denom_2000 = parseInt(document.getElementById('input-2000').value) || 0;
          const denom_1000 = parseInt(document.getElementById('input-1000').value) || 0;
          const denom_500 = parseInt(document.getElementById('input-500').value) || 0;
          const denom_coin = parseInt(document.getElementById('input-coin').value) || 0;
  
          const transactionTotal = denom_10000 + denom_5000 + denom_2000 + denom_1000 + denom_500 + denom_coin;
  
          const transaction = {
              date: new Date().toLocaleDateString(),
              transactionType,
              denom_10000,
              denom_5000,
              denom_2000,
              denom_1000,
              denom_500,
              denom_coin,
              transactionTotal
          };
  
          // Save to Firestore
          await db.collection("transactions").add(transaction);
          updateTransactionTable();
          $('#transactionModal').modal('hide');
      }
  
      async function updateTransactionTable() {
          transactionTableBody.innerHTML = '';
          let sum_10000 = 0, sum_5000 = 0, sum_2000 = 0, sum_1000 = 0, sum_500 = 0, sum_coin = 0;
          let closingBalance = openingBalance; // Start with the opening balance
  
          const snapshot = await db.collection("transactions").orderBy("date", "asc").get();
          snapshot.forEach(doc => {
              const transaction = doc.data();
              const row = document.createElement('tr');
              row.className = transaction.transactionType === 'out' ? 'out-row' : 'in-row';
  
              // Update closing balance based on transaction type
              if (transaction.transactionType === 'in') {
                  closingBalance += transaction.transactionTotal;
              } else if (transaction.transactionType === 'out') {
                  closingBalance -= transaction.transactionTotal;
              }
  
              row.innerHTML = `
                  <td>${transaction.date}</td>
                  <td>${transaction.transactionType}</td>
                  <td>${transaction.denom_10000}</td>
                  <td>${transaction.denom_5000}</td>
                  <td>${transaction.denom_2000}</td>
                  <td>${transaction.denom_1000}</td>
                  <td>${transaction.denom_500}</td>
                  <td>${transaction.denom_coin}</td>
                  <td>${transaction.transactionTotal}</td>
                  <td>${closingBalance}</td>
                  <td><button class="btn btn-danger btn-sm" onclick="deleteTransaction('${doc.id}')">Delete</button></td>
              `;
  
              transactionTableBody.appendChild(row);
              sum_10000 += transaction.denom_10000;
              sum_5000 += transaction.denom_5000;
              sum_2000 += transaction.denom_2000;
              sum_1000 += transaction.denom_1000;
              sum_500 += transaction.denom_500;
              sum_coin += transaction.denom_coin;
          });
  
          closingBalanceRow.innerHTML = `
              <td colspan="2"><strong>Closing Balance:</strong></td>
              <td>${sum_10000}</td>
              <td>${sum_5000}</td>
              <td>${sum_2000}</td>
              <td>${sum_1000}</td>
              <td>${sum_500}</td>
              <td>${sum_coin}</td>
              <td>${closingBalance}</td>
          `;
      }
  
      async function deleteTransaction(id) {
          await db.collection("transactions").doc(id).delete();
          updateTransactionTable();
      }
  
      function endDay() {
          alert("All transactions are closed for today!");
          // You can implement further closing logic here if needed.
      }
  
      async function fetchTransactions() {
          const snapshot = await db.collection("transactions").get();
          snapshot.forEach(doc => {
              const transaction = doc.data();
              transaction.id = doc.id; // Store the document ID for deletion
  
              // Create a new row for each transaction
              const row = document.createElement('tr');
              row.className = transaction.transactionType === 'out' ? 'out-row' : 'in-row';
  
              row.innerHTML = `
                  <td>${transaction.date}</td>
                  <td>${transaction.transactionType}</td>
                  <td>${transaction.denom_10000}</td>
                  <td>${transaction.denom_5000}</td>
                  <td>${transaction.denom_2000}</td>
                  <td>${transaction.denom_1000}</td>
                  <td>${transaction.denom_500}</td>
                  <td>${transaction.denom_coin}</td>
                  <td>${transaction.transactionTotal}</td>
                  <td><button class="btn btn-danger btn-sm" onclick="deleteTransaction('${transaction.id}')">Delete</button></td>
              `;
              
              transactionTableBody.appendChild(row);
          });
  
          calculateClosingBalance();
      }
  </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
