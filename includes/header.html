<!-- FIXED TOP NAVBAR -->
<header id="topNavbar" class="fixed top-0 inset-x-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800/80 transition-all duration-300">

    <!-- Left Controls & Brand -->

        <i data-lucide="menu" class="w-5 h-5 text-sky-600 dark:text-sky-400"></i>
      </button>
      
      <a href="index.html" class="flex items-center space-x-3 group">

          M

        <div class="hidden xs:block">

        <i data-lucide="calculator" class="w-3.5 h-3.5 text-sky-500"></i>

      </a>
      <a href="bondloan.html" class="px-3.5 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-900 hover:text-cyan-600 dark:hover:text-white transition flex items-center space-x-1.5">

        <span>Appraisals</span>

      <a href="letter.html" class="px-3.5 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-900 hover:text-purple-600 dark:hover:text-white transition flex items-center space-x-1.5">
